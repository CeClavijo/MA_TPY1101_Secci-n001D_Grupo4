<ion-header class="modal-header">
  <div class="modal-header__content">
    <div class="modal-header__title-group">
      <ion-icon name="lock-closed-outline" class="modal-header__icon"></ion-icon>
      <h2 class="modal-header__title">Recuperar Contraseña</h2>
    </div>
    <button class="modal-header__close-btn" (click)="dismiss()">
      <ion-icon name="close-outline"></ion-icon>
    </button>
  </div>
</ion-header>

<ion-content class="modal-content">
  <div class="modal-body">

    <p class="modal-body__description">
      Ingresa tu correo electrónico y te enviaremos un enlace para restablecer tu contraseña.
    </p>

    <form [formGroup]="form">
      <app-custom-input
        icon="mail-outline"
        label="Correo Electrónico"
        type="email"
        autocomplete="email"
        [control]="form.controls.email">
      </app-custom-input>
    </form>

  </div>
</ion-content>

<ion-footer class="modal-footer">
  <div class="modal-footer__actions">
    <button class="btn btn--outline" (click)="dismiss()">Cancelar</button>
    <button
      class="btn btn--primary"
      (click)="submit()"
      [disabled]="isSending">
      <ion-icon name="send-outline" *ngIf="!isSending"></ion-icon>
      <ion-spinner name="crescent" *ngIf="isSending"></ion-spinner>
      {{ isSending ? 'Enviando...' : 'Enviar enlace' }}
    </button>
  </div>
</ion-footer>
